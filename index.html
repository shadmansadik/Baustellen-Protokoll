<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Baustellen-Protokoll</title>
<meta name="theme-color" content="#1C2530">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="toast" class="toast" hidden></div>

<!-- ===================== HEADER / NAV ===================== -->
<header class="app-header">
  <button id="btnBack" class="icon-btn" hidden aria-label="Zurück">←</button>
  <h1 id="headerTitle">Baustellen-Protokoll</h1>
  <button id="btnAccount" class="icon-btn" aria-label="Konto / Drive">☁︎</button>
</header>

<main id="app"></main>

<!-- ===================== TEMPLATES ===================== -->

<template id="tpl-home">
  <section class="screen">
    <div class="drive-status" id="driveStatus">
      <span id="driveStatusText">Nicht mit Google Drive verbunden</span>
      <button id="btnConnectDrive" class="btn btn-small">Verbinden</button>
    </div>

    <div class="section-heading">
      <h2>Projekte</h2>
      <button id="btnNewProject" class="btn btn-primary">+ Neues Projekt</button>
    </div>

    <div id="projectList" class="project-list"></div>
    <p id="emptyState" class="empty-state" hidden>Noch keine Projekte. Tippe auf „+ Neues Projekt“, um zu starten.</p>
  </section>
</template>

<template id="tpl-new-project">
  <section class="screen">
    <form id="formNewProject" class="form">
      <label>Protokolltyp
        <select name="type" id="projType" required>
          <option value="abnahme">Abnahmeprotokoll</option>
          <option value="maengel">Mängelbeseitigung</option>
          <option value="custom">Eigenes Protokoll</option>
        </select>
      </label>

      <div id="linkProjectWrap" hidden>
        <label>Zugehöriges Abnahmeprotokoll (optional)
          <select name="linkedProjectId" id="linkedProjectSelect">
            <option value="">— keins —</option>
          </select>
        </label>
        <p class="hint">Wenn ausgewählt, werden alle Orte aus diesem Protokoll übernommen. Du fügst dann pro Ort die Mängelbeseitigungs-Fotos hinzu.</p>
      </div>

      <label>Titel
        <input type="text" name="title" id="projTitle" placeholder="z. B. PDP Karolingerstraße" required>
      </label>

      <label>Termin (Datum &amp; Uhrzeit)
        <input type="datetime-local" name="termin" id="projTermin">
      </label>

      <label>Teilnehmer (einer pro Zeile)
        <textarea name="teilnehmer" id="projTeilnehmer" rows="3" placeholder="Herr Müller&#10;Frau Schmidt"></textarea>
      </label>

      <button type="submit" class="btn btn-primary btn-block">Projekt erstellen</button>
    </form>
  </section>
</template>

<template id="tpl-project">
  <section class="screen">
    <div class="project-meta" id="projectMetaBox"></div>

    <div class="section-heading">
      <h2>Orte / Einträge</h2>
      <button id="btnNewEntry" class="btn btn-primary">+ Ort hinzufügen</button>
    </div>

    <div id="entryList" class="entry-list"></div>
    <p id="entryEmptyState" class="empty-state" hidden>Noch keine Einträge. Füge den ersten Ort mit Fotos hinzu.</p>

    <div class="export-bar">
      <button id="btnExportPdf" class="btn btn-secondary">PDF exportieren</button>
      <button id="btnExportDocx" class="btn btn-secondary">Word exportieren</button>
      <button id="btnSaveDrive" class="btn btn-secondary">In Drive speichern</button>
      <button id="btnDeleteProject" class="btn btn-danger">Projekt löschen</button>
    </div>
  </section>
</template>

<template id="tpl-entry">
  <section class="screen">
    <form id="formEntry" class="form">
      <label>Ort / Adresse
        <input type="text" name="title" id="entryTitle" placeholder="z. B. Karolingerstr. 13-19" required>
      </label>

      <label>Beschreibung (Zustand / Mangel)
        <textarea name="description" id="entryDescription" rows="3" placeholder="z. B. Pflaster regulieren, gebrochene Steine raus"></textarea>
      </label>

      <div class="photo-section">
        <div class="photo-section-head">
          <h3>Fotos</h3>
          <label class="btn btn-secondary file-btn">
            📷 Foto aufnehmen
            <input type="file" accept="image/*" capture="environment" id="photoInput" hidden>
          </label>
        </div>
        <div id="photoGrid" class="photo-grid"></div>
        <p id="photoHint" class="hint">Beim Aufnehmen werden GPS-Position, Adresse und Zeitstempel automatisch auf das Foto gestempelt.</p>
      </div>

      <div class="photo-section fix-section" id="fixSection">
        <div class="photo-section-head">
          <h3>Mängelbeseitigung</h3>
        </div>
        <label>Beschreibung der Behebung
          <textarea name="fixDescription" id="fixDescription" rows="2" placeholder="z. B. Steine ersetzt, Fugen neu verfüllt"></textarea>
        </label>
        <div class="photo-section-head">
          <label class="btn btn-secondary file-btn">
            📷 Foto aufnehmen
            <input type="file" accept="image/*" capture="environment" id="fixPhotoInput" hidden>
          </label>
        </div>
        <div id="fixPhotoGrid" class="photo-grid"></div>
      </div>

      <button type="submit" class="btn btn-primary btn-block">Speichern</button>
      <button type="button" id="btnDeleteEntry" class="btn btn-danger btn-block">Eintrag löschen</button>
    </form>
  </section>
</template>

<!-- ===================== LIBRARIES (CDN) ===================== -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://unpkg.com/docx@8.5.0/build/index.js"></script>
<script src="https://accounts.google.com/gsi/client" async defer></script>

<!-- ===================== APP CODE ===================== -->
<script src="config.js"></script>
<script src="db.js"></script>
<script src="model.js"></script>
<script src="drive.js"></script>
<script src="camera.js"></script>
<script src="export.js"></script>
<script src="app.js"></script>
</body>
</html>
